services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      MOCK_STT: "true"
      MOCK_TTS: "true"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1:8b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-network

networks:
  my-network:
