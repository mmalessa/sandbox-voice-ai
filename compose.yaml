services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      STT_COMMAND: "python3 /app/stt/wrapper.py"
      WHISPER_MODEL: "tiny"
      WHISPER_LANGUAGE: "pl"
      HF_HUB_OFFLINE: "1"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1:8b"
      PIPER_COMMAND: "python3 -m piper --model /app/voices/pl_PL-darkman-medium.onnx --output-raw"
      PIPER_SAMPLE_RATE: "22050"
    volumes:
      - whisper-models:/root/.cache/huggingface
      - piper-voices:/app/voices
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-network

volumes:
  whisper-models:
  piper-voices:

networks:
  my-network:
    external: true
    name: my-network
