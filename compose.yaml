services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama/models
      - ./scripts:/scripts
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      STT_COMMAND: "python3 /app/stt/wrapper.py"
      WHISPER_MODEL: "base"
      WHISPER_LANGUAGE: "pl"
      HF_HUB_OFFLINE: "1"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1:8b"
      OLLAMA_SYSTEM_PROMPT: "Jesteś zwięzłym asystentem głosowym. Odpowiadaj po polsku, krótko i wyraźnie."
      PIPER_COMMAND: "python3 -m piper --model /app/voices/pl_PL-gosia-medium.onnx --output-raw"
      PIPER_SAMPLE_RATE: "22050"
    volumes:
      - whisper-models:/root/.cache/huggingface
      - piper-voices:/app/voices
    depends_on:
      - ollama

volumes:
  ollama-models:
  whisper-models:
  piper-voices:
