<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Voice AI</title>
  <style>
    :root {
      --bg: #f3efe7;
      --card: #fffaf2;
      --ink: #1f1a17;
      --accent: #b24c2d;
      --accent-2: #2f6c63;
      --border: rgba(31, 26, 23, 0.12);
      --muted: rgba(31, 26, 23, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(178, 76, 45, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47, 108, 99, 0.2), transparent 30%),
        linear-gradient(180deg, #f6f1e8 0%, #efe8dc 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(720px, 100%);
      background: color-mix(in srgb, var(--card) 92%, white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(45, 33, 23, 0.12);
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3rem); }
    p  { margin: 0 0 16px; line-height: 1.5; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
      align-items: center;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: inherit;
      color: white;
      background: var(--accent);
      cursor: pointer;
      transition: background 0.2s;
    }
    button.secondary   { background: var(--accent-2); }
    button.recording   { background: #8b0000; animation: pulse 1s infinite; }
    button.interrupt   { background: #5a3e00; }
    button:disabled    { opacity: 0.5; cursor: not-allowed; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.6; }
    }
    #status {
      font-size: 0.9rem;
      color: var(--accent-2);
      font-style: italic;
    }
    .transcript-box {
      margin: 0 0 10px;
      padding: 12px 16px;
      background: rgba(47, 108, 99, 0.07);
      border-left: 3px solid var(--accent-2);
      border-radius: 8px;
      min-height: 2.4em;
      font-style: italic;
      color: var(--muted);
      white-space: pre-wrap;
    }
    pre {
      margin: 0;
      padding: 16px;
      background: rgba(31, 26, 23, 0.06);
      border-radius: 14px;
      min-height: 80px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Local Voice AI</h1>
    <p>Speak after clicking Record. Click again while AI is responding to interrupt it.</p>
    <div class="row">
      <button id="connect">Connect</button>
      <button id="record" class="secondary" disabled>Record</button>
      <span id="status"></span>
    </div>
    <div class="transcript-box" id="transcript">&nbsp;</div>
    <pre id="log"></pre>
  </main>

  <script>
    const logEl        = document.getElementById("log");
    const connectBtn   = document.getElementById("connect");
    const recordBtn    = document.getElementById("record");
    const statusEl     = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");

    let socket;
    let inTurn = false; // true between vad_end and "done" — enables barge-in

    function log(msg) {
      logEl.textContent += `${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(msg)     { statusEl.textContent     = msg; }
    function setTranscript(msg) { transcriptEl.textContent = msg || " "; }

    // --- Audio queue: plays WAV chunks sequentially, supports clear() for barge-in ---
    class AudioQueue {
      constructor() {
        this._ctx           = null;
        this._queue         = [];
        this._busy          = false;
        this._currentSource = null;
      }

      _ctx_() {
        if (!this._ctx || this._ctx.state === "closed") this._ctx = new AudioContext();
        return this._ctx;
      }

      busy() { return this._busy; }

      // Stop playback immediately and discard all queued audio.
      clear() {
        this._queue = [];
        this._busy  = false;
        if (this._currentSource) {
          this._currentSource.onended = null;
          try { this._currentSource.stop(); } catch (_) {}
          this._currentSource = null;
        }
      }

      enqueue(arrayBuffer) {
        this._queue.push(arrayBuffer);
        if (!this._busy) this._next();
      }

      async _next() {
        if (this._queue.length === 0) {
          this._busy          = false;
          this._currentSource = null;
          return;
        }
        this._busy = true;
        try {
          const decoded = await this._ctx_().decodeAudioData(this._queue.shift());
          const src     = this._ctx_().createBufferSource();
          src.buffer    = decoded;
          src.connect(this._ctx_().destination);
          src.onended         = () => this._next();
          this._currentSource = src;
          src.start();
        } catch (e) {
          log(`audio decode error: ${e.message}`);
          this._currentSource = null;
          this._next();
        }
      }
    }

    const audioQueue = new AudioQueue();

    // --- WebSocket ---
    connectBtn.addEventListener("click", () => {
      if (socket && socket.readyState < WebSocket.CLOSING) socket.close();

      socket = new WebSocket(`ws://${location.host}/ws`);
      socket.binaryType = "arraybuffer";

      socket.onopen = () => {
        log("websocket connected");
        recordBtn.disabled = false;
        setStatus("ready");
      };

      socket.onmessage = (event) => {
        if (typeof event.data === "string") {
          const msg = JSON.parse(event.data);
          switch (msg.type) {
            case "transcript":
              setTranscript(msg.text);
              break;
            case "done":
              inTurn = false;
              recordBtn.classList.remove("interrupt");
              recordBtn.classList.add("secondary");
              recordBtn.textContent = "Record";
              recordBtn.disabled    = false;
              setStatus("ready");
              log("response complete");
              break;
          }
          return;
        }
        // Binary = WAV audio chunk
        log(`received ${event.data.byteLength} bytes`);
        audioQueue.enqueue(event.data);
      };

      socket.onerror = () => log("websocket error");
      socket.onclose = (ev) => {
        log(`websocket closed: ${ev.code}`);
        inTurn = false;
        recordBtn.disabled = true;
        setStatus("");
        setTranscript("");
      };
    });

    // --- VAD config ---
    const SILENCE_THRESHOLD  = 0.02;
    const MAX_RECORD_MS      = 30000;
    const SHORT_SILENCE_MS   = 250;  // pause long enough to trigger STT
    let   SILENCE_MS         = 2000;

    fetch("/config")
      .then(r => r.json())
      .then(cfg => { if (cfg.vad_silence_ms) SILENCE_MS = cfg.vad_silence_ms; })
      .catch(() => {});

    // --- Recording ---
    recordBtn.addEventListener("click", async () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log("websocket is not open");
        return;
      }

      // Barge-in: user speaks while AI is responding.
      if (inTurn) {
        audioQueue.clear();
        socket.send(JSON.stringify({ type: "interrupt" }));
        inTurn = false;
        log("interrupted AI response");
        setTranscript("");
        // Fall through — start recording for the new turn.
      }

      recordBtn.disabled = true;
      recordBtn.classList.remove("interrupt", "secondary");
      recordBtn.classList.add("recording");
      recordBtn.textContent = "Recording…";
      setStatus("Listening...");
      setTranscript("");

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        log(`microphone error: ${e.message}`);
        recordBtn.disabled = false;
        recordBtn.classList.remove("recording");
        recordBtn.classList.add("secondary");
        recordBtn.textContent = "Record";
        setStatus("ready");
        return;
      }

      const vadCtx   = new AudioContext();
      const analyser = vadCtx.createAnalyser();
      analyser.fftSize = 512;
      vadCtx.createMediaStreamSource(stream).connect(analyser);

      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : "audio/webm";

      const recorder      = new MediaRecorder(stream, { mimeType });
      const allChunks     = [];
      let lastSendPromise = Promise.resolve();

      // Accumulate only — STT sends are driven by silence detection in the VAD loop.
      recorder.ondataavailable = (e) => {
        if (e.data.size === 0) return;
        allChunks.push(e.data);
      };

      function sendToSTT() {
        if (!speechSeen || socket.readyState !== WebSocket.OPEN) return;
        const blob = new Blob(allChunks, { type: mimeType });
        lastSendPromise = blob.arrayBuffer().then(buf => {
          if (socket.readyState === WebSocket.OPEN) socket.send(buf);
        });
      }

      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        vadCtx.close();
        recordBtn.classList.remove("recording");

        if (!speechSeen) {
          recordBtn.classList.add("secondary");
          recordBtn.textContent = "Record";
          recordBtn.disabled    = false;
          setStatus("ready");
          return;
        }

        // Ensure the final cumulative blob is sent before vad_end.
        await lastSendPromise;
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "vad_end" }));
        }

        // Allow barge-in: button re-enabled while AI is processing/responding.
        inTurn = true;
        recordBtn.classList.add("interrupt");
        recordBtn.textContent = "Interrupt";
        recordBtn.disabled    = false;
        setStatus("Processing...");
      };

      const pcmData       = new Float32Array(analyser.fftSize);
      let speechSeen      = false;
      let silenceStart    = null;
      let shortSilenceSent = false; // true once STT was triggered for the current pause
      const startTime     = Date.now();

      recorder.start(100);

      function vad() {
        if (recorder.state !== "recording") return;

        if (Date.now() - startTime > MAX_RECORD_MS) {
          recorder.stop();
          return;
        }

        analyser.getFloatTimeDomainData(pcmData);
        const rms = Math.sqrt(pcmData.reduce((s, v) => s + v * v, 0) / pcmData.length);

        if (rms > SILENCE_THRESHOLD) {
          if (!speechSeen) {
            speechSeen = true;
            setStatus("Speaking...");
            log("speech detected");
          }
          silenceStart     = null;
          shortSilenceSent = false; // reset so next pause triggers STT again
        } else if (speechSeen) {
          if (silenceStart === null) {
            silenceStart = Date.now();
          } else {
            const silenceDuration = Date.now() - silenceStart;

            // Short pause → send cumulative audio to STT for a partial transcript.
            if (silenceDuration >= SHORT_SILENCE_MS && !shortSilenceSent) {
              shortSilenceSent = true;
              sendToSTT();
            }

            // Long pause → end of turn.
            if (silenceDuration >= SILENCE_MS) {
              log("silence detected — sending vad_end");
              recorder.stop();
              return;
            }
          }
        }

        requestAnimationFrame(vad);
      }

      requestAnimationFrame(vad);
    });
  </script>
</body>
</html>
