<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Voice AI</title>
  <style>
    :root {
      --bg: #f3efe7;
      --card: #fffaf2;
      --ink: #1f1a17;
      --accent: #b24c2d;
      --accent-2: #2f6c63;
      --border: rgba(31, 26, 23, 0.12);
      --muted: rgba(31, 26, 23, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(178, 76, 45, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47, 108, 99, 0.2), transparent 30%),
        linear-gradient(180deg, #f6f1e8 0%, #efe8dc 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(720px, 100%);
      background: color-mix(in srgb, var(--card) 92%, white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(45, 33, 23, 0.12);
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3rem); }
    p  { margin: 0 0 16px; line-height: 1.5; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
      align-items: center;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: inherit;
      color: white;
      background: var(--accent);
      cursor: pointer;
      transition: background 0.2s;
    }
    button.secondary  { background: var(--accent-2); }
    button.recording  { background: #8b0000; animation: pulse 1s infinite; }
    button:disabled   { opacity: 0.5; cursor: not-allowed; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.6; }
    }
    #status {
      font-size: 0.9rem;
      color: var(--accent-2);
      font-style: italic;
    }
    .transcript-box {
      margin: 0 0 10px;
      padding: 12px 16px;
      background: rgba(47, 108, 99, 0.07);
      border-left: 3px solid var(--accent-2);
      border-radius: 8px;
      min-height: 2.4em;
      font-style: italic;
      color: var(--muted);
      white-space: pre-wrap;
    }
    pre {
      margin: 0;
      padding: 16px;
      background: rgba(31, 26, 23, 0.06);
      border-radius: 14px;
      min-height: 80px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Local Voice AI</h1>
    <p>Speak after clicking Record — response begins streaming as sentences are recognised.</p>
    <div class="row">
      <button id="connect">Connect</button>
      <button id="record" class="secondary" disabled>Record</button>
      <span id="status"></span>
    </div>
    <div class="transcript-box" id="transcript">&nbsp;</div>
    <pre id="log"></pre>
  </main>

  <script>
    const logEl        = document.getElementById("log");
    const connectBtn   = document.getElementById("connect");
    const recordBtn    = document.getElementById("record");
    const statusEl     = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");

    let socket;

    function log(msg) {
      logEl.textContent += `${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(msg)     { statusEl.textContent     = msg; }
    function setTranscript(msg) { transcriptEl.textContent = msg || " "; }

    // --- Audio queue: plays WAV chunks sequentially via AudioContext ---
    class AudioQueue {
      constructor() {
        this._ctx  = null;
        this._queue = [];
        this._busy  = false;
      }

      _ctx_() {
        if (!this._ctx || this._ctx.state === "closed") this._ctx = new AudioContext();
        return this._ctx;
      }

      enqueue(arrayBuffer) {
        this._queue.push(arrayBuffer);
        if (!this._busy) this._next();
      }

      async _next() {
        if (this._queue.length === 0) { this._busy = false; return; }
        this._busy = true;
        try {
          const decoded = await this._ctx_().decodeAudioData(this._queue.shift());
          const src = this._ctx_().createBufferSource();
          src.buffer = decoded;
          src.connect(this._ctx_().destination);
          src.onended = () => this._next();
          src.start();
        } catch (e) {
          log(`audio decode error: ${e.message}`);
          this._next();
        }
      }
    }

    const audioQueue = new AudioQueue();

    // --- WebSocket ---
    connectBtn.addEventListener("click", () => {
      if (socket && socket.readyState < WebSocket.CLOSING) socket.close();

      socket = new WebSocket(`ws://${location.host}/ws`);
      socket.binaryType = "arraybuffer";

      socket.onopen = () => {
        log("websocket connected");
        recordBtn.disabled = false;
        setStatus("ready");
      };

      socket.onmessage = (event) => {
        if (typeof event.data === "string") {
          const msg = JSON.parse(event.data);
          if (msg.type === "transcript") {
            setTranscript(msg.text);
          } else if (msg.type === "done") {
            setStatus("ready");
            recordBtn.disabled = false;
            log("response complete");
          }
          return;
        }
        // Binary = WAV audio chunk
        log(`received ${event.data.byteLength} bytes`);
        audioQueue.enqueue(event.data);
      };

      socket.onerror = () => log("websocket error");
      socket.onclose = (ev) => {
        log(`websocket closed: ${ev.code}`);
        recordBtn.disabled = true;
        setStatus("");
        setTranscript("");
      };
    });

    // --- VAD config ---
    const SILENCE_THRESHOLD = 0.02;
    const MAX_RECORD_MS     = 30000;
    let   SILENCE_MS        = 2000;

    fetch("/config")
      .then(r => r.json())
      .then(cfg => { if (cfg.vad_silence_ms) SILENCE_MS = cfg.vad_silence_ms; })
      .catch(() => {});

    // --- Recording with partial-blob streaming ---
    recordBtn.addEventListener("click", async () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log("websocket is not open");
        return;
      }

      recordBtn.disabled = true;
      recordBtn.classList.add("recording");
      setStatus("Listening...");
      setTranscript("");

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        log(`microphone error: ${e.message}`);
        recordBtn.disabled = false;
        recordBtn.classList.remove("recording");
        setStatus("ready");
        return;
      }

      const vadCtx   = new AudioContext();
      const analyser = vadCtx.createAnalyser();
      analyser.fftSize = 512;
      vadCtx.createMediaStreamSource(stream).connect(analyser);

      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : "audio/webm";

      const recorder = new MediaRecorder(stream, { mimeType });
      const allChunks = [];

      // Track the most recent send promise to guarantee ordering: the final
      // cumulative blob always arrives at the server before vad_end.
      let lastSendPromise = Promise.resolve();

      recorder.ondataavailable = (e) => {
        if (e.data.size === 0) return;
        allChunks.push(e.data);

        if (!speechSeen || socket.readyState !== WebSocket.OPEN) return;

        // Send the growing cumulative blob so the server can run STT early.
        const blob = new Blob(allChunks, { type: mimeType });
        lastSendPromise = blob.arrayBuffer().then(buf => {
          if (socket.readyState === WebSocket.OPEN) socket.send(buf);
        });
      };

      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        vadCtx.close();
        recordBtn.classList.remove("recording");

        if (!speechSeen) {
          setStatus("ready");
          recordBtn.disabled = false;
          return;
        }

        // Wait for the last partial send, then signal end-of-turn.
        await lastSendPromise;
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "vad_end" }));
        }
        setStatus("Processing...");
        // recordBtn stays disabled until {"type":"done"} arrives
      };

      const pcmData    = new Float32Array(analyser.fftSize);
      let speechSeen   = false;
      let silenceStart = null;
      const startTime  = Date.now();

      // timeslice=1000: ondataavailable fires every 1s, giving us natural
      // 1-second audio segments to accumulate and stream to the server.
      recorder.start(1000);

      function vad() {
        if (recorder.state !== "recording") return;

        if (Date.now() - startTime > MAX_RECORD_MS) {
          recorder.stop();
          return;
        }

        analyser.getFloatTimeDomainData(pcmData);
        const rms = Math.sqrt(pcmData.reduce((s, v) => s + v * v, 0) / pcmData.length);

        if (rms > SILENCE_THRESHOLD) {
          if (!speechSeen) {
            speechSeen = true;
            setStatus("Speaking...");
            log("speech detected");
          }
          silenceStart = null;
        } else if (speechSeen) {
          if (silenceStart === null) {
            silenceStart = Date.now();
          } else if (Date.now() - silenceStart > SILENCE_MS) {
            log("silence detected — sending vad_end");
            recorder.stop();
            return;
          }
        }

        requestAnimationFrame(vad);
      }

      requestAnimationFrame(vad);
    });
  </script>
</body>
</html>
